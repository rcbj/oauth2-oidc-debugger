version: '3'
services:
  api:
    container_name: api
    image: rcbj/api
    environment:
      - CONFIG_FILE=./env/local.js
    build:
      context: .
      dockerfile: ./api/Dockerfile
      args:
        CONFIG_FILE: ${CONFIG_FILE}
    ports:
      - "4000:4000"
  client:
    container_name: client
    image: rcbj/client
    environment:
      - CONFIG_FILE=./env/local.js
    build:
      context: .
      dockerfile: ./client/Dockerfile
      args:
        CONFIG_FILE: ${CONFIG_FILE}
        # Optional: CI fixes the build number so the image and the git tag agree.
        # Unset locally -> version.js falls back to the UTC build instant.
        BUILD_NUMBER: ${BUILD_NUMBER:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    ports:
      - "3000:3000"
  sts:
    environment:
      # Log level, chosen the same way as for api and client.
      - CONFIG_FILE=./env/local.js
    container_name: sts
    image: rcbj/sts
    build:
      context: .
      dockerfile: ./sts/Dockerfile
    ports:
      - "8081:8081"
